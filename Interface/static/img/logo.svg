<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">

  <!-- ── Outer hex glow (layered opacity, no filters) ── -->
  <polygon points="182,100 141,171 59,171 18,100 59,29 141,29"
           fill="none" stroke="#00FFD1" stroke-width="12" opacity="0.04"/>
  <polygon points="182,100 141,171 59,171 18,100 59,29 141,29"
           fill="none" stroke="#00FFD1" stroke-width="7"  opacity="0.10"/>
  <polygon points="182,100 141,171 59,171 18,100 59,29 141,29"
           fill="none" stroke="#00FFD1" stroke-width="3"  opacity="0.35"/>
  <!-- Outer hex main -->
  <polygon points="182,100 141,171 59,171 18,100 59,29 141,29"
           fill="none" stroke="#00FFD1" stroke-width="1.8"/>

  <!-- ── Corner bracket markers at each vertex ── -->
  <g stroke="#00FFD1" stroke-width="1.4" fill="none" stroke-linecap="butt">
    <!-- right (182,100) -->
    <polyline points="177,95 182,95 182,100"/>
    <polyline points="177,105 182,105 182,100"/>
    <!-- left (18,100) -->
    <polyline points="23,95 18,95 18,100"/>
    <polyline points="23,105 18,105 18,100"/>
    <!-- top-right (141,29) -->
    <polyline points="136,34 141,29 146,34"/>
    <!-- top-left (59,29) -->
    <polyline points="64,34 59,29 54,34"/>
    <!-- bottom-right (141,171) -->
    <polyline points="136,166 141,171 146,166"/>
    <!-- bottom-left (59,171) -->
    <polyline points="64,166 59,171 54,166"/>
  </g>

  <!-- ── Vertex dots ── -->
  <g fill="#00FFD1">
    <circle cx="182" cy="100" r="5"   opacity="0.15"/>
    <circle cx="141" cy="171" r="5"   opacity="0.15"/>
    <circle cx="59"  cy="171" r="5"   opacity="0.15"/>
    <circle cx="18"  cy="100" r="5"   opacity="0.15"/>
    <circle cx="59"  cy="29"  r="5"   opacity="0.15"/>
    <circle cx="141" cy="29"  r="5"   opacity="0.15"/>
    <circle cx="182" cy="100" r="2.8"/>
    <circle cx="141" cy="171" r="2.8"/>
    <circle cx="59"  cy="171" r="2.8"/>
    <circle cx="18"  cy="100" r="2.8"/>
    <circle cx="59"  cy="29"  r="2.8"/>
    <circle cx="141" cy="29"  r="2.8"/>
  </g>

  <!-- ── Spokes center→vertices ── -->
  <g stroke="#005A50" stroke-width="0.9">
    <line x1="100" y1="100" x2="182" y2="100"/>
    <line x1="100" y1="100" x2="141" y2="171"/>
    <line x1="100" y1="100" x2="59"  y2="171"/>
    <line x1="100" y1="100" x2="18"  y2="100"/>
    <line x1="100" y1="100" x2="59"  y2="29"/>
    <line x1="100" y1="100" x2="141" y2="29"/>
  </g>

  <!-- ── Mid hex (dashed, flat-top R=55) ── -->
  <polygon points="155,100 128,148 73,148 45,100 73,52 128,52"
           fill="none" stroke="#007A63" stroke-width="0.9" stroke-dasharray="4,3"/>

  <!-- ── Circuit traces: mid-hex vertices → outer edge midpoints ── -->
  <g stroke="#00FFD1" stroke-width="0.7" opacity="0.25">
    <line x1="162" y1="136" x2="155" y2="100"/>
    <line x1="100" y1="171" x2="128" y2="148"/>
    <line x1="39"  y1="136" x2="73"  y2="148"/>
    <line x1="39"  y1="65"  x2="45"  y2="100"/>
    <line x1="100" y1="29"  x2="73"  y2="52"/>
    <line x1="162" y1="65"  x2="128" y2="52"/>
  </g>

  <!-- ── Edge midpoint dots ── -->
  <g fill="#00FFD1" opacity="0.55">
    <circle cx="162" cy="136" r="2.2"/>
    <circle cx="100" cy="171" r="2.2"/>
    <circle cx="39"  cy="136" r="2.2"/>
    <circle cx="39"  cy="65"  r="2.2"/>
    <circle cx="100" cy="29"  r="2.2"/>
    <circle cx="162" cy="65"  r="2.2"/>
  </g>

  <!-- ── Inner hex glow (pointy-top R=32) ── -->
  <polygon points="100,68 128,84 128,116 100,132 72,116 72,84"
           fill="none" stroke="#00FFD1" stroke-width="7" opacity="0.07"/>
  <polygon points="100,68 128,84 128,116 100,132 72,116 72,84"
           fill="none" stroke="#00FFD1" stroke-width="4" opacity="0.18"/>
  <polygon points="100,68 128,84 128,116 100,132 72,116 72,84"
           fill="none" stroke="#00FFD1" stroke-width="1.5" opacity="0.95"/>

  <!-- ── Inner hex vertex dots ── -->
  <g fill="#00C4A0" opacity="0.7">
    <circle cx="100" cy="68"  r="1.8"/>
    <circle cx="128" cy="84"  r="1.8"/>
    <circle cx="128" cy="116" r="1.8"/>
    <circle cx="100" cy="132" r="1.8"/>
    <circle cx="72"  cy="116" r="1.8"/>
    <circle cx="72"  cy="84"  r="1.8"/>
  </g>

  <!-- ── Red center hex glow ── -->
  <polygon points="100,84 114,92 114,108 100,116 86,108 86,92"
           fill="#FF2D55" opacity="0.08"/>
  <polygon points="100,84 114,92 114,108 100,116 86,108 86,92"
           fill="none" stroke="#FF2D55" stroke-width="8" opacity="0.12"/>
  <polygon points="100,84 114,92 114,108 100,116 86,108 86,92"
           fill="none" stroke="#FF2D55" stroke-width="5" opacity="0.25"/>
  <!-- Red center hex fill + stroke -->
  <polygon points="100,84 114,92 114,108 100,116 86,108 86,92"
           fill="#AA0E22"/>
  <polygon points="100,84 114,92 114,108 100,116 86,108 86,92"
           fill="none" stroke="#FF2D55" stroke-width="1.5"/>

  <!-- ── Inner mini hex ── -->
  <polygon points="100,90 107,94 107,106 100,110 93,106 93,94"
           fill="#FF4060" opacity="0.85"/>

  <!-- ── Center dot ── -->
  <circle cx="100" cy="100" r="9"   fill="#FF2D55" opacity="0.12"/>
  <circle cx="100" cy="100" r="5"   fill="#FF2D55" opacity="0.4"/>
  <circle cx="100" cy="100" r="3"   fill="#FF4060"/>
  <circle cx="100" cy="100" r="1.4" fill="white"   opacity="0.95"/>

</svg>
